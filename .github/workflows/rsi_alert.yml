name: Bybit RSI Alert

on:
  schedule:
    # 매시간 정각마다 실행 (1회 실행 시 55분간 30초 주기로 연속 감시)
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: bybit-rsi-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-rsi:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install ccxt pandas requests

      - name: RSI 실시간 감시 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python rsi_alert.py
