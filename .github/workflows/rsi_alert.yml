name: Bybit RSI Alert

on:
  schedule:
    # 정각 혼잡을 피해 매 15분마다 대기열 생성 (끊김 없는 이어달리기)
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

concurrency:
  group: bybit-rsi-bot
  cancel-in-progress: false  # 실행 중인 봇을 강제 종료하지 않고 끝나면 즉시 이어서 실행

permissions:
  contents: write

jobs:
  check-rsi:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install ccxt pandas requests

      - name: RSI 실시간 감시 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python rsi_alert.py
