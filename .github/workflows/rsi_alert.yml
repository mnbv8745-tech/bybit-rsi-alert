name: Bybit RSI Alert

on:
  schedule:
    # 5분마다 스케줄 대기열 생성 (공백 최소화)
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: bybit-rsi-bot
  cancel-in-progress: false  # 이미 돌고 있는 봇은 끄지 않고 끝나는 즉시 이어받기

permissions:
  contents: write
  actions: write

jobs:
  check-rsi:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests pandas

      - name: RSI 실시간 감시 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python rsi_alert.py
